user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

    upstream next_app {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        # Max body for uploads (large videos)
        client_max_body_size 500M;

        # Static uploads with video streaming support
        location /uploads/ {
            alias /var/www/uploads/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Enable range requests for video seeking
            add_header Content-Range $content_range;
            add_header Accept-Ranges bytes;
            try_files $uri $uri/ =404;
        }

        # Next.js app and API
        location / {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Specific for large uploads if needed
        location /api/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            proxy_pass http://next_app;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 500M;
        }
    }
}
